# spring.datasource.username=policy_service_user
# spring.datasource.password=secret
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# spring.jpa.hibernate.ddl-auto=update # Use 'validate' or 'none' in production
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.com.insurance.policyservice=INFO
logging.level.org.springframework.web=INFO

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# PDF Generation related properties (if needed)
