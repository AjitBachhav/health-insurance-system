# server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Default Datasource configuration (SHOULD BE MOVED TO CONFIG SERVER for security)
# spring.datasource.url=jdbc:postgresql://localhost:5432/claims_db
# spring.datasource.username=claims_service_user
# spring.datasource.password=secret
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# spring.jpa.hibernate.ddl-auto=update # Use 'validate' or 'none' in production
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.com.insurance.claimsservice=INFO
logging.level.org.springframework.web=INFO

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Document Storage Configuration (e.g., S3 - MOVE TO CONFIG SERVER)
