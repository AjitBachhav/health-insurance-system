# Spring Cloud Config Client Configuration
spring.application.name=user-service

# Location of the Config Server (adjust if necessary)
spring.cloud.config.uri=http://localhost:8888

# Profile to fetch from Config Server (e.g., default, dev, prod)
# spring.profiles.active=default

# Optional: Fail fast if Config Server is unavailable on startup
# spring.cloud.config.fail-fast=true

# Optional: Retry settings for connecting to Config Server
# spring.cloud.config.retry.initial-interval=1000
# spring.cloud.config.retry.max-attempts=6
# spring.cloud.config.retry.multiplier=1.1
# spring.cloud.config.retry.max-interval=2000


