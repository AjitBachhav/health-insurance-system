# Application specific properties (can be overridden by Config Server)

# Server Port (Consider moving to Config Server for flexibility)
# server.port=8081

# Eureka Client Configuration (Essential for Service Discovery)
# Service Registry URL (Adjust if Eureka server runs elsewhere)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Instance settings (optional, helps identify the service instance)
eureka.instance.prefer-ip-address=true
# eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Default Datasource configuration (SHOULD BE MOVED TO CONFIG SERVER for security)
# spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
# spring.datasource.username=user_service_user
# spring.datasource.password=secret
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Defaults are often sufficient)
# spring.jpa.hibernate.ddl-auto=update # Use 'validate' or 'none' in production
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.com.insurance.userservice=INFO
logging.level.org.springframework.web=INFO
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator endpoints (enabled by default with web starter)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

